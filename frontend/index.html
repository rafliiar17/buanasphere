<!DOCTYPE html>
<html lang="id" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurs World — Pasar Valuta Asing Global 195+ Negara</title>
    <meta name="description" content="Informasi kurs valuta asing real-time 195+ negara dunia terhadap Indonesian Rupiah (IDR). Grafik interaktif ala Google Finance, peta kurs dunia, dan tanpa markup komersial." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kurs_world_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div style="position:fixed;inset:0;background:#0B0F19;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;color:#F8FAFC;user-select:none;z-index:999;">
        <div style="display:flex;align-items:baseline;gap:2px;margin-bottom:16px;">
          <span style="font-size:32px;font-weight:800;letter-spacing:-0.03em;color:#F8FAFC;">Kurs</span>
          <span style="font-size:32px;font-weight:800;letter-spacing:-0.03em;color:#FB7185;">.World</span>
          <span style="margin-left:8px;font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#64748B;padding:2px 6px;border:1px solid #223049;border-radius:4px;">BETA</span>
        </div>
        <div style="width:32px;height:32px;border:2.5px solid rgba(56,189,248,0.2);border-top-color:#38BDF8;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px;"></div>
        <span style="font-size:11px;font-weight:600;color:#94A3B8;letter-spacing:0.02em;">Memuat Pasar Valuta Asing Global...</span>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
