name: Deploy Kurs World to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 🧪 Quality Gates & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun Runtime (v1.4+)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔍 Verify Strict Bun Runtime (v1.4+)
        run: bun ./scripts/ensure-bun.ts

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Type Checking & Diagnostics
        run: bun run check

      - name: 🧪 Execute Test Suites (TDD / Vitest / Bun Test)
        run: bun test

      - name: 🏗️ Build Frontend Static Artifacts
        run: bun run build

      - name: 📤 Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy-cloudflare-pages:
    name: 🌐 Deploy Frontend to Cloudflare Pages (kurs.arafz.id)
    needs: [test-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun Runtime (v1.4+)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📥 Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 🚀 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun x wrangler pages deploy frontend/dist --project-name=kurs-world-frontend --commit-dirty=true

  deploy-cloudflare-workers:
    name: ⚡ Deploy Backend API to Cloudflare Workers (kurs-world-api)
    needs: [test-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun Runtime (v1.4+)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🗄️ Apply Cloudflare D1 Remote Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: |
          bun x wrangler d1 migrations apply DB --remote

      - name: 🚀 Deploy Elysia API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: |
          bun x wrangler deploy
